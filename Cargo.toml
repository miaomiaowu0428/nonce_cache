[package]
name = "nonce_cache"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.12"
anyhow = "1.0.102"
serde_json = "1.0.150"
ahash = "0.8"
log = "0.4"
env_logger = "0.11.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
grpc-client = { git = "https://github.com/miaomiaowu0428/grpc-client.git", branch = "supportV1" }
utils = { git = "https://github.com/miaomiaowu0428/sol-utils.git", branch = "supportV1" }
solana-client = "4.2.2"
solana-sdk = "4.0.0"
solana-transaction-status = { version = "4.2.2", features = ["agave-unstable-api"] }
borsh = "1.7"
futures = "0.3.32"
yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = "12.7.0"
tonic = "0.14.5"
solana-commitment-config = "3.1.1"
whirlwind = { git = "https://github.com/miaomiaowu0428/whirlwind.git" }
sled = "0.34"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
chrono = "0.4"
spl-program-error = "0.8.0"

[workspace]
